name: Publish Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-release.yml"

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm windows:build
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles app
      - run: pnpm mac:sign:adhoc
      - run: pnpm mac:dmg:adhoc
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: src-tauri/target/release/bundle/dmg/*_aarch64_adhoc.dmg

  publish:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: packages
      - name: Prepare release assets
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes=".github/release-notes/${tag}.md"
          test -f "$notes"
          mkdir -p release
          find packages -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -exec cp {} release/ \;
          test "$(find release -type f | wc -l | tr -d ' ')" -ge 3
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Codex Status Floater ${RELEASE_VERSION}" --notes-file "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --title "Codex Status Floater ${RELEASE_VERSION}" --notes-file "$RELEASE_NOTES"
          fi
